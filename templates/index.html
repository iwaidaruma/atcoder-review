<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>学習記録アプリ</title>
</head>
<body>
    <aside>
        <h2>問題一覧</h2>
        <ul>
            <li>問題A</li>
            <li>問題B</li>
        </ul>
    </aside>

    <main>
        <header>
            <h1>問題A</h1>
            <p>タグ：累積和、配列</p>
            <button>＋ 新しい問題を記録</button>
        </header>

        <section>
            <h2>挑戦・復習の記録</h2>
            <p>解答状況：解説を見て解けた</p>
            <p>メモ：累積和を使うことに気づかなかった。</p>
            <button>復習の記録を追加</button>
        </section>
    </main>
</body>
</html>
