<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>学習記録アプリ</title>
</head>
<body>
    <h1>学習記録</h1>
    <aside>
        <h2>問題一覧</h2>
        <ul>
            {% for prob in html_problems %}
            <li>{{ prob["title"] }}
            <form action="/delete" method="post">
                <input type="hidden" name="del_problem_id" value="{{ prob['id'] }}">
                <button type="submit">削除する</button>
            </form>
            <a href="/edit?problem_id={{ prob['id'] }}">！問題を編集する</a> <!-- urlにidの情報をつけて/editに飛-->
            </li>
            {% endfor %}
        </ul>
    </aside>

    <main>
            
        <header>
            <a href="/new">＋ 新しい問題を記録</a>
        </header>
    </main>
</body>
</html>
