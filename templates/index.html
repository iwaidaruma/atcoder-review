<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>学習記録アプリ</title>
</head>
<body>
    <h1>学習記録</h1>
    <aside>
        <h2>問題一覧</h2>
        <ul>
            {% for prob in problems %}
            <li>{{ prob["title"] }}</li>
            <form action="/delete" method="post">
                <input type="hidden" name="problem_id" value="{{ prob['id'] }}">
                <button type="submit">削除する</button>
            </form>
            {% endfor %}
        </ul>
    </aside>

    <main>
        <header>
            <a href="/new">＋ 新しい問題を記録</a>
        </header>

        <section>
            <h2>復習の記録</h2>
            <p>解答状況：解説を見て解けた</p>
            <p>メモ：累積和を使うことに気づかなかった。</p>
            <button>復習の記録を追加</button>
        </section>
    </main>
</body>
</html>
