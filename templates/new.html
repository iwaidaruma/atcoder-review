<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>問題を記録</title>
</head>
<body>
    <h1>新しい問題を記録</h1>
    <form method="post">
        <div>
            <label for="problem_name">問題の名前を入力</label>
            <input type="text" id = "problem_name" name ="problem_name" required> <!--idはラベルと対応-->
        </div>
        <div>
            <label for="problem_url">問題のURLを入力</label>
            <input type="url" id = "problem_url" name ="problem_url" required>
        </div>
        <div>
            <label for="problem_memo" >メモ</label>
            <textarea  id="problem_memo" name="problem_memo"></textarea> 
        </div>
        <div>
            <button type="submit">記録する</button>
        </div>
        
        <div>
            {% if problem_name != None %}
            <p>受け取った問題名:{{ problem_name }}</p>
            <p>受け取ったURL:{{ problem_url }}</p>
            {% endif %}
        </div>
    </form>
    
    <a href="/">トップページへ戻る</a>
</body>
</html>
